<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost Loot - AR Checkpoint</title>
    <link rel="stylesheet" href="css/styles.css">

    <!-- A-Frame and AR.js Libraries -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <!-- Dynamic Loader Script -->
    <script>
        const params = new URLSearchParams(window.location.search);
        const checkpointId = params.get('checkpointId');

        if (checkpointId) {
            const script = document.createElement('script');
            script.type = 'module';
            script.src = `js/ar-checkpoint${checkpointId}.js`;
            document.head.appendChild(script);
        } else {
            // Fallback or error handling
            alert("No checkpoint ID specified! Returning to HUD.");
            window.location.href = 'hud.html';
        }
    </script>

    <style>
        #seq-board {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 10px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }
        .seq-slot {
            width: 40px;
            height: 40px;
            border: 2px solid #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            color: #fff;
            font-weight: bold;
        }
        .seq-slot.filled {
            background-color: #4CAF50;
            border-color: #4CAF50;
        }
        #wrong-msg {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(255, 0, 0, 0.7);
            color: white;
            padding: 20px;
            border-radius: 10px;
            font-size: 24px;
            z-index: 100;
            display: none; /* Initially hidden */
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">
    <!-- AR Scene for a markerless experience -->
    <a-scene
        vr-mode-ui="enabled: false"
        arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;">

        <!-- The camera is the center of the world. We'll attach our compass to it. -->
        <a-camera cursor="rayOrigin: mouse;">
            <!-- This camera is now empty. Checkpoint-specific scripts will add their own models to it. -->
        </a-camera>
    </a-scene>

    <!-- 2D UI Overlay -->
    <div id="ar-ui-overlay">
        <a href="hud.html" class="button-secondary" id="back-to-hud-btn">Back to HUD</a>

        <div id="feedback-container">
            <p id="instruction-text">Loading minigame...</p>
            <div id="wrong-msg">Wrong! Try again.</div>
            <div id="seq-board">
                <span class="seq-slot">•</span>
                <span class="seq-slot">•</span>
                <span class="seq-slot">•</span>
                <span class="seq-slot">•</span>
                <span class="seq-slot">•</span>
                <span class="seq-slot">•</span>
            </div>
        </div>

        <div id="win-message" class="hidden">
            <h2>Key Collected!</h2>
            <p>The Captain's first key is yours!</p>
        </div>

        <!-- Visual feedback elements -->
        <div id="progress-indicator" class="hidden"></div>
        <div id="screen-glow" class="hidden"></div>
    </div>

    <!-- The old static script is removed. The dynamic loader will add the correct one. -->
</body>
</html>

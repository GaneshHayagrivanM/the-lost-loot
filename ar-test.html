<!-- MOBILE VERSION -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Test AR Checkpoint 4</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const script = document.createElement("script");
      script.type = "module";
      script.src = "js/ar-checkpoint4.js";
      document.head.appendChild(script);
    });
  </script>

  <style>
    html, body {
      margin: 0; padding: 0; overflow: hidden; height: 100vh; width: 100vw;
      font-family: sans-serif;
    }
    #ar-ui-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 10; display: flex; flex-direction: column;
      justify-content: space-between; align-items: center;
      padding: 1rem; pointer-events: none; box-sizing: border-box;
    }
    #ar-ui-overlay > * { pointer-events: auto; }
    #instruction-text {
      background: rgba(0,0,0,0.6); color: #fff;
      padding: 6px 10px; border-radius: 6px; font-size: 14px; /* Smaller on mobile */
      max-width: 90%;
    }
    #win-message {
      display: none; background: rgba(0,0,0,0.6);
      color: #fff; padding: 10px; border-radius: 8px;
      text-align: center; font-size: 16px;
    }
    #win-message:not(.hidden) { display: block; }
    #seq-board {
      background: rgba(0,0,0,0.6); color: white; padding: 6px 10px;
      border-radius: 8px; display: flex; gap: 8px; font-size: 18px;
    }
    .seq-slot {
      width: 30px; height: 30px; display: flex;
      align-items: center; justify-content: center;
      background: rgba(255,255,255,0.2); border-radius: 6px;
    }
    .seq-slot.filled { background: gold; color: black; font-weight: bold; }
    #wrong-msg {
      background: rgba(200,40,40,0.9); color: white;
      padding: 6px 12px; border-radius: 8px; font-size: 14px;
      display: none;
    }
  
    a-scene {
      height: 100vh !important; width: 100vw !important;
      position: absolute; top: 0; left: 0;
    }
    a-scene > a-videosphere { 
      width: 100vw; height: 100vh;
    }

    #overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #000000bb; pointer-events: none; z-index: 9999;
      mask: radial-gradient(circle 50vw at center, transparent 99%, black 100%);
      mask-composite: exclude;
      -webkit-mask: radial-gradient(circle 50vw at center, transparent 99%, black 100%);
      -webkit-mask-composite: source-out; 
    }
    @media (max-width: 768px) {
      #seq-board { gap: 4px; font-size: 16px; }
      .seq-slot { width: 25px; height: 25px; }
      #instruction-text { font-size: 12px; padding: 4px 8px; }
    }
  </style>
</head>
<body>
  <a-scene embedded
           vr-mode-ui="enabled: false"
           arjs="sourceType: webcam; debugUIEnabled: true; trackingMethod: best; sourceWidth: {default: 640}; sourceHeight: {default: 480}; displayWidth: {default: 640}; displayHeight: {default: 480};">
    <a-assets>
    </a-assets>
    <a-camera id="camera" cursor="rayOrigin: mouse; fuse: false" raycaster="objects: .clickable; far: 50; interval: 0; useWorldCoordinates: false;" look-controls="enabled: true"></a-camera>
  </a-scene>

  <div id="overlay"></div>

  <div id="ar-ui-overlay">
    <div id="seq-board">
      <div class="seq-slot">•</div>
      <div class="seq-slot">•</div>
      <div class="seq-slot">•</div>
      <div class="seq-slot">•</div>
      <div class="seq-slot">•</div>
      <div class="seq-slot">•</div>
    </div>
    <div id="wrong-msg">Wrong sequence!</div>
    <div id="win-message" class="hidden">
      <h2>Success!</h2>
      <p>Chests unlocked!</p>
    </div>
  </div>
</body>
</html>
